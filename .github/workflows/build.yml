name: Build & Release

# Triggered when release-please publishes a GitHub Release (stable or prerelease).
# Also supports manual runs via workflow_dispatch.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ github.event.release.tag_name || format('dev.{0}', github.run_number) }}

      - name: Package release zip
        run: |
          mkdir -p release/data
          cp dist/time_tracker.html release/time_tracker.html
          cp src/data/init.json release/data/init.json
          cp release/data/init.json release/data/backup.json
          cd release && zip -r ../time_tracker.zip .

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: time-tracker
          path: time_tracker.zip
          archive: false

      - name: Attach zip to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" time_tracker.zip --clobber
