<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Tracker</title>
<style>
  :root {
    --font-sans: 'Segoe UI', system-ui, -apple-system, sans-serif;
    --font-mono: 'Cascadia Code', 'Cascadia Mono', Consolas, 'Courier New', monospace;

    /* backgrounds */
    --bg:     #0e0e0e;
    --bg-0:   #151515;
    --bg-1:   #1c1c1c;
    --bg-2:   #252525;

    /* foreground */
    --fg-0:   #d0d0d0;
    --fg-1:   #888888;
    --fg-2:   #4a4a4a;

    /* accents */
    --red:    #e05555;
    --green:  #4dab90;
    --blue:   #5aafed;

    /* borders */
    --bd-0:   #5aafed;   /* focus */
    --bd-1:   #2e2e2e;   /* normal */
    --bd-2:   #1d1d1d;   /* subtle */
    --bd-red: #e05555;
    --bd-blue:#1e4a72;

    /* tinted fills */
    --bg-red: rgba(224,85,85,.08);
    --bg-blue:rgba(90,175,237,.08);

    /* ── aliases consumed by inline var() references in the JS ── */
    --color-text-primary:         var(--fg-0);
    --color-text-secondary:       var(--fg-1);
    --color-text-tertiary:        var(--fg-2);
    --color-text-danger:          var(--red);
    --color-text-success:         var(--green);
    --color-text-info:            var(--blue);
    --color-background-primary:   var(--bg-0);
    --color-background-secondary: var(--bg-2);
    --color-background-danger:    var(--bg-red);
    --color-background-info:      var(--bg-blue);
    --color-border-primary:       var(--bd-0);
    --color-border-secondary:     var(--bd-1);
    --color-border-tertiary:      var(--bd-2);
    --color-border-danger:        var(--bd-red);
    --color-border-info:          var(--bd-blue);
    --border-radius-md:           2px;
    --border-radius-lg:           3px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    background: var(--bg);
    color: var(--fg-0);
    font-family: var(--font-sans);
    font-size: 13px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }

  body { min-height: 100vh; }

  #app {
    max-width: 660px;
    margin: 0 auto;
    padding: 0 18px 48px;
  }

  /* scrollbar */
  ::-webkit-scrollbar             { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track       { background: transparent; }
  ::-webkit-scrollbar-thumb       { background: var(--bd-1); }
  ::-webkit-scrollbar-thumb:hover { background: #444; }

  /* ── header ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0 10px;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--bd-2);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }

  .title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .10em;
    text-transform: uppercase;
    color: var(--fg-1);
  }

  .total-badge {
    font-size: 12px;
    font-family: var(--font-mono);
    color: var(--fg-1);
    background: var(--bg-0);
    border: 1px solid var(--bd-2);
    border-radius: 2px;
    padding: 3px 9px;
  }

  .total-badge span { font-weight: 600; color: var(--fg-0); }

  .date-badge {
    font-size: 11px;
    color: var(--fg-2);
    font-family: var(--font-mono);
  }

  /* ── toolbar ── */
  .toolbar {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--bd-2);
  }

  .tool-btn {
    font-size: 11px;
    font-family: var(--font-sans);
    padding: 4px 10px;
    border: 1px solid var(--bd-1);
    border-radius: 2px;
    background: transparent;
    color: var(--fg-1);
    cursor: pointer;
    transition: background .1s, color .1s;
    white-space: nowrap;
  }

  .tool-btn:hover                { background: var(--bg-2); color: var(--fg-0); }
  .tool-btn.primary              { color: var(--blue); border-color: var(--bd-blue); }
  .tool-btn.primary:hover        { background: var(--bg-blue); }

  /* ── charge code cards ── */
  .cc-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 0;
  }

  .cc-card {
    background: var(--bg-0);
    border: 1px solid var(--bd-2);
    border-radius: 3px;
    padding: 9px 12px;
    transition: border-color .1s;
  }

  .cc-card:hover { border-color: var(--bd-1); }

  .cc-card.empty-state {
    border-style: dashed;
    text-align: center;
    padding: 2.5rem;
    color: var(--fg-2);
    font-size: 12px;
  }

  /* ── program group cards ── */
  .pg-card {
    background: var(--bg-0);
    border: 1px solid var(--bd-2);
    border-radius: 3px;
    transition: border-color .1s;
  }

  .pg-card:hover { border-color: var(--bd-1); }

  .pg-header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 7px 12px 6px;
    border-bottom: 1px solid var(--bd-2);
  }

  .pg-name {
    flex: 1;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--fg-1);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .pg-total {
    font-size: 16px;
    font-weight: 600;
    font-family: var(--font-mono);
    color: var(--fg-0);
    min-width: 44px;
    text-align: right;
    letter-spacing: -.02em;
  }

  .pg-total.zero { color: var(--fg-2); }

  .pg-row { padding: 9px 12px; }
  .pg-row + .pg-row { border-top: 1px dashed var(--bd-2); }

  .cc-top { display: flex; align-items: baseline; gap: 10px; margin-bottom: 7px; }
  .cc-label { flex: 1; min-width: 0; }

  .cc-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--fg-0);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cc-code {
    font-size: 10px;
    color: var(--fg-2);
    font-family: var(--font-mono);
    letter-spacing: .04em;
    margin-top: 1px;
  }

  .cc-hours {
    font-size: 20px;
    font-weight: 600;
    font-family: var(--font-mono);
    color: var(--fg-0);
    min-width: 44px;
    text-align: right;
    letter-spacing: -.02em;
  }

  .cc-hours.zero { color: var(--fg-2); }

  /* ── increment buttons ── */
  .cc-bottom { display: flex; align-items: center; gap: 3px; flex-wrap: wrap; }

  .btn-inc {
    font-size: 11px;
    font-family: var(--font-mono);
    padding: 3px 7px;
    border: 1px solid var(--bd-1);
    border-radius: 2px;
    background: transparent;
    color: var(--fg-0);
    cursor: pointer;
    transition: background .08s;
    min-width: 36px;
    text-align: center;
  }

  .btn-inc:hover  { background: var(--bg-2); }
  .btn-inc:active { transform: scale(0.95); }

  .btn-inc.neg       { color: var(--red); border-color: var(--bd-2); }
  .btn-inc.neg:hover { background: var(--bg-red); }

  .note-input {
    flex: 1;
    min-width: 100px;
    font-size: 11px;
    font-family: var(--font-sans);
    padding: 3px 7px;
    border: 1px solid var(--bd-2);
    border-radius: 2px;
    background: var(--bg);
    color: var(--fg-0);
  }

  .note-input::placeholder { color: var(--fg-2); }
  .note-input:focus        { outline: none; border-color: var(--bd-0); }

  /* ── per-CC log ── */
  .spread-excl-label {
    font-size: 10px;
    color: var(--fg-2);
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-top: 5px;
    cursor: pointer;
    font-family: var(--font-mono);
    user-select: none;
  }
  .spread-excl-label:hover { color: var(--fg-1); }
  .spread-excl-label input[type="checkbox"] { cursor: pointer; accent-color: var(--blue); margin: 0; }

  .log-toggle {
    font-size: 10px;
    color: var(--fg-2);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
    margin-top: 5px;
    display: inline-block;
    font-family: var(--font-mono);
  }

  .log-toggle:hover { color: var(--fg-1); }

  .log-list {
    margin-top: 5px;
    border-top: 1px solid var(--bd-2);
    padding-top: 5px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .log-entry {
    font-size: 11px;
    font-family: var(--font-mono);
    color: var(--fg-1);
    display: flex;
    gap: 8px;
  }

  .log-time  { color: var(--fg-2); white-space: nowrap; }
  .log-delta { min-width: 36px; }
  .log-delta.pos { color: var(--green); }
  .log-delta.neg { color: var(--red); }
  .log-entry span:last-child { font-family: var(--font-sans); }

  /* ── modals ── */
  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.60);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }

  .modal {
    background: var(--bg-1);
    border: 1px solid var(--bd-1);
    border-radius: 3px;
    padding: 18px 20px;
    width: min(440px,92vw);
    max-height: 80vh;
    overflow-y: auto;
  }

  .modal h2 {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--fg-1);
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--bd-2);
  }

  .field { margin-bottom: 10px; }

  .field label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--fg-1);
    display: block;
    margin-bottom: 4px;
  }

  .field input {
    width: 100%;
    font-size: 13px;
    font-family: var(--font-sans);
    padding: 6px 9px;
    border: 1px solid var(--bd-1);
    border-radius: 2px;
    background: var(--bg);
    color: var(--fg-0);
  }

  .field input:focus { outline: none; border-color: var(--bd-0); }

  .modal-actions {
    display: flex;
    gap: 6px;
    justify-content: flex-end;
    margin-top: 14px;
    padding-top: 10px;
    border-top: 1px solid var(--bd-2);
  }

  .cc-manage-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 0;
    border-bottom: 1px solid var(--bd-2);
  }

  .cc-manage-item:last-child { border-bottom: none; }
  .cc-manage-name  { flex: 1; font-size: 12px; color: var(--fg-0); }

  .cc-manage-code {
    font-size: 10px;
    color: var(--fg-2);
    font-family: var(--font-mono);
    min-width: 72px;
  }

  .del-btn {
    font-size: 10px;
    padding: 2px 7px;
    border: 1px solid var(--bd-red);
    border-radius: 2px;
    background: transparent;
    color: var(--red);
    cursor: pointer;
  }

  .del-btn:hover { background: var(--bg-red); }

  .export-box {
    font-family: var(--font-mono);
    font-size: 11px;
    line-height: 1.65;
    background: var(--bg);
    border: 1px solid var(--bd-2);
    border-radius: 2px;
    padding: 10px 12px;
    white-space: pre;
    overflow-x: auto;
    margin-bottom: 10px;
    color: var(--fg-1);
  }

  .reset-warn { font-size: 12px; color: var(--red); margin-top: 8px; }

  /* ── clock bar ── */
  .clock-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 12px;
    margin-bottom: 12px;
    background: var(--bg-0);
    border: 1px solid var(--bd-2);
    border-left: 3px solid var(--bd-2);
    border-radius: 3px;
    transition: border-left-color .3s;
  }

  .clock-bar.running  { border-left-color: var(--green); }
  .clock-bar.stopped  { border-left-color: var(--red); }

  .clock-indicator         { font-size: 9px; color: var(--red); }
  .clock-indicator.running { color: var(--green); animation: clock-pulse 2s infinite; }

  @keyframes clock-pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: .35; }
  }

  .clock-status-text {
    font-size: 11px;
    color: var(--fg-1);
    font-family: var(--font-mono);
    flex: 1;
  }

  .clock-status-text.stopped { color: var(--red); font-weight: 600; }

  .clock-total-display {
    font-size: 16px;
    font-weight: 600;
    font-family: var(--font-mono);
    color: var(--fg-0);
    min-width: 44px;
    text-align: right;
  }

  .clock-total-display.zero { color: var(--fg-2); }

  /* ── sessions modal ── */
  .session-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 0;
    border-bottom: 1px solid var(--bd-2);
  }

  .session-row:last-child { border-bottom: none; }

  .time-input {
    width: 68px;
    font-size: 12px;
    font-family: var(--font-mono);
    padding: 3px 6px;
    border: 1px solid var(--bd-1);
    border-radius: 2px;
    background: var(--bg);
    color: var(--fg-0);
    text-align: center;
  }

  .time-input:focus { outline: none; border-color: var(--bd-0); }
  .time-input.running-end { color: var(--fg-2); }

  /* ── day navigation ── */
  .nav-btn {
    font-size: 18px;
    line-height: 1;
    padding: 0 3px;
    border: none;
    background: transparent;
    color: var(--fg-2);
    cursor: pointer;
    transition: color .1s;
  }
  .nav-btn:hover:not(:disabled) { color: var(--fg-0); }
  .nav-btn:disabled { opacity: .2; cursor: default; }

  .past-day-banner {
    font-size: 11px;
    color: var(--blue);
    background: var(--bg-blue);
    border: 1px solid var(--bd-blue);
    border-radius: 2px;
    padding: 5px 10px;
    margin-bottom: 10px;
    font-family: var(--font-mono);
    display: flex;
    align-items: center;
    gap: 8px;
  }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="title">Time tracker</div>
    <div style="display:flex;align-items:center;gap:4px">
      <button class="nav-btn" onclick="navigate(-1)" title="Previous day">&#8249;</button>
      <span class="date-badge" id="date-badge"></span>
      <button class="nav-btn" id="nav-fwd" onclick="navigate(1)" title="Next day">&#8250;</button>
      <div class="total-badge" style="margin-left:4px">Total: <span id="grand-total">0.0</span> hr</div>
    </div>
  </div>

  <div class="toolbar">
    <button class="tool-btn primary" onclick="openAddCC()">+ Add charge code</button>
    <button class="tool-btn" onclick="openManage()">Manage CCs</button>
    <button class="tool-btn" onclick="openExport()">Export / copy</button>
    <button class="tool-btn" onclick="openSpread()">Spread hours</button>
    <button class="tool-btn" onclick="confirmReset()">Reset day</button>
  </div>

  <div id="past-day-banner" style="display:none" class="past-day-banner">
    Viewing a past day &mdash; edits apply to that day.
    <button class="tool-btn" style="margin-left:auto" onclick="goToToday()">Go to today</button>
  </div>
  <div id="clock-bar" class="clock-bar"></div>

  <div class="cc-list" id="cc-list"></div>
</div>

<div id="modal-root"></div>

<script>
const INCS = [0.1, 0.5, 1.0];
const NEG_INCS = [-0.1, -0.5, -1.0];
const STORAGE_KEY = 'cc_tracker_v3';

// ── Persistence ─────────────────────────────────────────────────────────────
// v3 schema: { codes:[{id,code,name}], days:{"YYYY-MM-DD":{hours:{id:n},log:[],clock:{sessions:[]}}} }
// Migrates from v2 (cc_tracker_v2) and clock v1 (cc_tracker_clock_v1) on first load.

function today() { return new Date().toISOString().slice(0,10); }

function migrateFromV2() {
  try {
    const raw = localStorage.getItem('cc_tracker_v2');
    if (!raw) return null;
    const v2 = JSON.parse(raw);
    const v3 = {codes: [], days: {}};
    v3.codes = (v2.codes || []).map(({id, code, name}) => ({id, code, name}));
    if (v2.date) {
      const hours = {};
      (v2.codes || []).forEach(c => { hours[c.id] = c.hours || 0; });
      v3.days[v2.date] = {hours, log: v2.log || [], clock: {sessions: []}};
      try {
        const cs = JSON.parse(localStorage.getItem('cc_tracker_clock_v1') || '{}');
        if (cs.date === v2.date && cs.sessions) v3.days[v2.date].clock = {sessions: cs.sessions};
      } catch(e) {}
    }
    return v3;
  } catch(e) { return null; }
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return migrateFromV2() || {codes: [], days: {}};
}

function save(s) {
  // keep at most 14 days
  const keys = Object.keys(s.days || {}).sort();
  while (keys.length > 14) delete s.days[keys.shift()];
  localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
}

function dayData(date) {
  if (!state.days) state.days = {};
  if (!state.days[date]) state.days[date] = {hours: {}, log: [], clock: {sessions: []}};
  const d = state.days[date];
  if (!d.clock) d.clock = {sessions: []};
  return d;
}

let state = load();
let viewDate = today();

// ── Day navigation ───────────────────────────────────────────────────────────
function navigate(delta) {
  const d = new Date(viewDate + 'T12:00:00');
  d.setDate(d.getDate() + delta);
  const next = d.toISOString().slice(0,10);
  if (next > today()) return;
  viewDate = next;
  render();
  renderClock();
}

function goToToday() {
  viewDate = today();
  render();
  renderClock();
}

// ── CC logic ─────────────────────────────────────────────────────────────────
function addTime(id, delta) {
  const cc = state.codes.find(c => c.id === id);
  if (!cc) return;
  const noteEl = document.getElementById('note-'+id);
  const note = noteEl ? noteEl.value.trim() : '';
  const day = dayData(viewDate);
  const prev = day.hours[id] || 0;
  day.hours[id] = Math.max(0, parseFloat((prev + delta).toFixed(1)));
  day.log.push({id, delta, result: day.hours[id], note,
    ts: new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})});
  if (noteEl) noteEl.value = '';
  save(state);
  render();
}

function renderCCControls(cc, day) {
  const hrs = day.hours[cc.id] || 0;
  const ccLog = day.log.filter(e => e.id === cc.id);
  const hasLog = ccLog.length > 0;
  return `<div class="cc-top">
        <div class="cc-label">
          <div class="cc-name">${esc(cc.name)}</div>
          <div class="cc-code">${esc(cc.code)}</div>
        </div>
        <div class="cc-hours ${hrs===0?'zero':''}">${hrs.toFixed(1)}</div>
      </div>
      <div class="cc-bottom">
        ${INCS.map(d=>`<button class="btn-inc" onclick="addTime('${cc.id}',${d})">+${d.toFixed(1)}</button>`).join('')}
        ${NEG_INCS.map(d=>`<button class="btn-inc neg" onclick="addTime('${cc.id}',${d})">${d.toFixed(1)}</button>`).join('')}
        <input class="note-input" id="note-${cc.id}" placeholder="note (optional)">
      </div>
      <label class="spread-excl-label"><input type="checkbox" ${cc.spreadExcluded?'':'checked'} onchange="toggleSpreadExclude('${cc.id}',this.checked)"> spread</label>
      ${hasLog ? `<span class="log-toggle" onclick="toggleLog('${cc.id}')">history (${ccLog.length})</span>
      <div class="log-list" id="log-${cc.id}" style="display:none">
        ${ccLog.slice().reverse().map(e=>`<div class="log-entry"><span class="log-time">${e.ts}</span><span class="log-delta ${e.delta>0?'pos':'neg'}">${e.delta>0?'+':''}${e.delta.toFixed(1)}</span><span>${e.note||''}</span></div>`).join('')}
      </div>` : ''}`;
}

function renderIndividualCard(cc, day) {
  return `<div class="cc-card">${renderCCControls(cc, day)}</div>`;
}

function renderProgramCard(programName, codes, day) {
  const pgTotal = codes.reduce((s,c) => s + (day.hours[c.id] || 0), 0);
  const rows = codes.map(cc => `<div class="pg-row">${renderCCControls(cc, day)}</div>`).join('');
  return `<div class="pg-card">
    <div class="pg-header">
      <div class="pg-name">${esc(programName)}</div>
      <div class="pg-total ${pgTotal===0?'zero':''}">${pgTotal.toFixed(1)}</div>
    </div>
    ${rows}
  </div>`;
}

function render() {
  const isToday = viewDate === today();
  const viewDt = new Date(viewDate + 'T12:00:00');
  document.getElementById('date-badge').textContent =
    viewDt.toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'}) +
    (isToday ? ' — today' : '');

  const navFwd = document.getElementById('nav-fwd');
  if (navFwd) navFwd.disabled = isToday;

  const banner = document.getElementById('past-day-banner');
  if (banner) banner.style.display = isToday ? 'none' : 'flex';

  const day = dayData(viewDate);
  const total = state.codes.reduce((s,c) => s + (day.hours[c.id] || 0), 0);
  document.getElementById('grand-total').textContent = total.toFixed(1);

  const list = document.getElementById('cc-list');
  if (!state.codes.length) {
    list.innerHTML = '<div class="cc-card empty-state">No charge codes yet — add one above</div>';
    return;
  }

  const grouped = {};
  const ungrouped = [];
  state.codes.forEach(cc => {
    const prog = (cc.program || '').trim();
    if (prog) {
      if (!grouped[prog]) grouped[prog] = [];
      grouped[prog].push(cc);
    } else {
      ungrouped.push(cc);
    }
  });
  const programNames = Object.keys(grouped)
    .sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));

  list.innerHTML = [
    ...programNames.map(n => renderProgramCard(n, grouped[n], day)),
    ...ungrouped.map(cc => renderIndividualCard(cc, day))
  ].join('');
}

function toggleLog(id) {
  const el = document.getElementById('log-'+id);
  if (el) { el.style.display = el.style.display==='none'?'flex':'none'; el.style.flexDirection='column'; }
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function uid() { return Math.random().toString(36).slice(2,8); }

// ── Modals ───────────────────────────────────────────────────────────────────
function openAddCC() {
  showModal(`<h2>Add charge code</h2>
    <div class="field"><label>Code / number</label><input id="m-code" placeholder="e.g. 1234-001" autocomplete="off"></div>
    <div class="field"><label>Label / description</label><input id="m-name" placeholder="e.g. design" autocomplete="off"></div>
    <div class="field"><label>Program (optional)</label><input id="m-program" placeholder="e.g. Program A" autocomplete="off"></div>
    <div class="modal-actions">
      <button class="tool-btn" onclick="closeModal()">Cancel</button>
      <button class="tool-btn primary" onclick="submitAddCC()">Add</button>
    </div>`);
  setTimeout(()=>document.getElementById('m-code')?.focus(),50);
}

function submitAddCC() {
  const code = document.getElementById('m-code').value.trim();
  const name = document.getElementById('m-name').value.trim();
  const program = document.getElementById('m-program').value.trim();
  if (!code) return;
  state.codes.push({id:uid(), code, name: name||code, program});
  save(state);
  closeModal();
  render();
}

function openManage() {
  const rows = state.codes.length
    ? state.codes.map(cc => {
        const prog = (cc.program || '').trim();
        const progTag = prog
          ? `<span style="font-size:10px;color:var(--blue);font-family:var(--font-mono);max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0" title="${esc(prog)}">${esc(prog)}</span>`
          : `<span style="min-width:0;flex-shrink:0"></span>`;
        return `<div class="cc-manage-item">
          <span class="cc-manage-code">${esc(cc.code)}</span>
          ${progTag}
          <span class="cc-manage-name">${esc(cc.name)}</span>
          <button class="tool-btn" style="margin-left:auto" onclick="openEditCC('${cc.id}')">Edit</button>
          <button class="del-btn" onclick="deleteCC('${cc.id}')">Remove</button>
        </div>`;
      }).join('')
    : '<p style="font-size:13px;color:var(--color-text-tertiary)">No charge codes yet.</p>';
  showModal(`<h2>Manage charge codes</h2>${rows}
    <div class="modal-actions"><button class="tool-btn" onclick="closeModal()">Done</button></div>`);
}

function openEditCC(id) {
  const cc = state.codes.find(c => c.id === id);
  if (!cc) return;
  showModal(`<h2>Edit charge code</h2>
    <div class="field"><label>Code / number</label><input id="e-code" value="${esc(cc.code)}" autocomplete="off"></div>
    <div class="field"><label>Label / description</label><input id="e-name" value="${esc(cc.name)}" autocomplete="off"></div>
    <div class="field"><label>Program (optional)</label><input id="e-program" value="${esc(cc.program||'')}" placeholder="e.g. Program A" autocomplete="off"></div>
    <div class="modal-actions">
      <button class="tool-btn" onclick="openManage()">Cancel</button>
      <button class="tool-btn primary" onclick="submitEditCC('${id}')">Save</button>
    </div>`);
  setTimeout(()=>document.getElementById('e-program')?.focus(),50);
}

function submitEditCC(id) {
  const cc = state.codes.find(c => c.id === id);
  if (!cc) return;
  const code = document.getElementById('e-code').value.trim();
  const name = document.getElementById('e-name').value.trim();
  const program = document.getElementById('e-program').value.trim();
  if (!code) return;
  cc.code = code;
  cc.name = name || code;
  cc.program = program;
  save(state);
  render();
  openManage();
}

function deleteCC(id) {
  state.codes = state.codes.filter(c => c.id !== id);
  Object.values(state.days||{}).forEach(day => {
    delete day.hours[id];
    day.log = day.log.filter(e => e.id !== id);
  });
  save(state);
  openManage();
  render();
}

function openExport() {
  const viewDt = new Date(viewDate + 'T12:00:00');
  const dateStr = viewDt.toLocaleDateString([], {weekday:'long',year:'numeric',month:'long',day:'numeric'});
  const day = dayData(viewDate);
  const total = state.codes.reduce((s,c) => s + (day.hours[c.id]||0), 0);
  const lines = [`Time summary — ${dateStr}`, ''];
  state.codes.forEach(cc => {
    const hrs = day.hours[cc.id] || 0;
    lines.push(`${cc.code}  ${cc.name}`);
    lines.push(`  ${hrs.toFixed(1)} hr`);
    day.log.filter(e => e.id===cc.id && e.note).forEach(e => lines.push(`  ${e.ts}  ${e.note}`));
    lines.push('');
  });
  lines.push(`Total: ${total.toFixed(1)} hr`);
  const text = lines.join('\n');
  showModal(`<h2>Export</h2>
    <div class="export-box" id="export-text">${esc(text)}</div>
    <div class="modal-actions">
      <button class="tool-btn" onclick="closeModal()">Close</button>
      <button class="tool-btn primary" onclick="copyExport()">Copy to clipboard</button>
    </div>`);
  window._exportText = text;
}

function copyExport() {
  navigator.clipboard.writeText(window._exportText||'').then(()=>{
    const btn = document.querySelector('#modal-root .primary');
    if(btn){btn.textContent='Copied!';setTimeout(()=>btn.textContent='Copy to clipboard',1500);}
  });
}

function confirmReset() {
  const viewDt = new Date(viewDate + 'T12:00:00');
  const label = viewDate===today() ? 'today'
    : viewDt.toLocaleDateString([], {weekday:'long',month:'short',day:'numeric'});
  showModal(`<h2>Reset day</h2>
    <p style="font-size:14px;color:var(--color-text-secondary)">This clears all hours, history, and clock sessions for ${label}. Charge codes are kept.</p>
    <p class="reset-warn">This cannot be undone.</p>
    <div class="modal-actions">
      <button class="tool-btn" onclick="closeModal()">Cancel</button>
      <button class="tool-btn" style="color:var(--color-text-danger);border-color:var(--color-border-danger)" onclick="doReset()">Reset</button>
    </div>`);
}

function doReset() {
  const day = dayData(viewDate);
  state.codes.forEach(c => { day.hours[c.id] = 0; });
  day.log = [];
  day.clock = {sessions: []};
  save(state);
  closeModal();
  render();
  renderClock();
}

function toggleSpreadExclude(id, included) {
  const cc = state.codes.find(c => c.id === id);
  if (!cc) return;
  cc.spreadExcluded = !included;
  save(state);
  render();
}

// ── Spread hours ─────────────────────────────────────────────────────────────
// Distributes unallocated clock time proportionally across CCs that already
// have logged hours.  Uses integer tenths throughout to avoid float drift.

function computeSpread(activeCCs, dayHours, clockTotalHrs) {
  const loggedTenths = activeCCs.reduce((s,c) => s + Math.round((dayHours[c.id]||0)*10), 0);
  const clockTenths  = Math.round(clockTotalHrs * 10);
  const unallocTenths = clockTenths - loggedTenths;
  if (unallocTenths <= 0 || loggedTenths === 0) return null;

  // Exact proportional share for each CC (in tenths)
  const exact = activeCCs.map(c => (Math.round((dayHours[c.id]||0)*10) / loggedTenths) * unallocTenths);

  // Floor each, then give leftover tenths to largest fractional parts
  const floors = exact.map(v => Math.floor(v));
  let remainder = unallocTenths - floors.reduce((s,v) => s+v, 0);
  exact.map((v,i) => ({i, frac: v - Math.floor(v)}))
       .sort((a,b) => b.frac - a.frac)
       .forEach(({i}) => { if (remainder-- > 0) floors[i]++; });

  return activeCCs.map((c,i) => {
    const beforeT = Math.round((dayHours[c.id]||0)*10);
    return { id: c.id, name: c.name, before: beforeT/10, add: floors[i]/10, after: (beforeT+floors[i])/10 };
  });
}

let _pendingSpread = null;

function openSpread() {
  const day = dayData(viewDate);
  const clockHrs = parseFloat((Math.floor(clockTotalHours()*10)/10).toFixed(1));
  const activeCCs = state.codes.filter(c => (day.hours[c.id]||0) > 0 && !c.spreadExcluded);
  const loggedHrs = parseFloat(state.codes.reduce((s,c) => s+(day.hours[c.id]||0), 0).toFixed(1));
  const unallocHrs = parseFloat((clockHrs - loggedHrs).toFixed(1));

  const bail = (msg) => showModal(`<h2>Spread hours</h2>
    <p style="font-size:13px;color:var(--fg-1);margin-bottom:14px">${msg}</p>
    <div class="modal-actions"><button class="tool-btn primary" onclick="closeModal()">OK</button></div>`);

  if (clockHrs === 0)        return bail('No clock time recorded for this day.');
  if (activeCCs.length === 0) return bail('No charge code hours to spread from — log some time first.');
  if (unallocHrs <= 0)       return bail(`No unallocated time: logged <strong>${loggedHrs.toFixed(1)} hr</strong> already meets or exceeds clock time <strong>${clockHrs.toFixed(1)} hr</strong>.`);

  _pendingSpread = computeSpread(activeCCs, day.hours, clockHrs);

  const rows = _pendingSpread.map(s => {
    const cc = state.codes.find(c => c.id === s.id);
    const prog = (cc?.program || '').trim();
    const label = prog ? `${prog}: ${s.name}` : s.name;
    return `<div style="display:flex;align-items:baseline;gap:10px;padding:5px 0;border-bottom:1px solid var(--bd-2)">
      <span style="flex:1;font-size:12px;color:var(--fg-0)">${esc(label)}</span>
      <span style="font-family:var(--font-mono);font-size:12px;color:var(--fg-2);min-width:32px;text-align:right">${s.before.toFixed(1)}</span>
      <span style="font-family:var(--font-mono);font-size:12px;color:var(--blue);min-width:36px;text-align:right">+${s.add.toFixed(1)}</span>
      <span style="font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--green);min-width:36px;text-align:right">${s.after.toFixed(1)}</span>
    </div>`;
  }).join('');

  const newTotal = _pendingSpread.reduce((s,r) => s + Math.round(r.after*10), 0) / 10;

  showModal(`<h2>Spread hours</h2>
    <div style="display:flex;gap:16px;font-size:12px;color:var(--fg-1);font-family:var(--font-mono);margin-bottom:12px">
      <span>Clock&nbsp;<strong style="color:var(--fg-0)">${clockHrs.toFixed(1)} hr</strong></span>
      <span>Logged&nbsp;<strong style="color:var(--fg-0)">${loggedHrs.toFixed(1)} hr</strong></span>
      <span>Unallocated&nbsp;<strong style="color:var(--blue)">${unallocHrs.toFixed(1)} hr</strong></span>
    </div>
    <div style="display:flex;gap:10px;padding:2px 0 5px;font-size:10px;color:var(--fg-2);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--bd-1)">
      <span style="flex:1">Charge code</span>
      <span style="min-width:32px;text-align:right">Before</span>
      <span style="min-width:36px;text-align:right">Add</span>
      <span style="min-width:36px;text-align:right">After</span>
    </div>
    ${rows}
    <div style="display:flex;gap:10px;padding:6px 0 0;font-size:12px;font-family:var(--font-mono)">
      <span style="flex:1;color:var(--fg-2)">New total</span>
      <span style="min-width:32px"></span><span style="min-width:36px"></span>
      <span style="font-weight:600;color:var(--fg-0);min-width:36px;text-align:right">${newTotal.toFixed(1)}</span>
    </div>
    <div class="modal-actions">
      <button class="tool-btn" onclick="closeModal()">Cancel</button>
      <button class="tool-btn primary" onclick="applySpread()">Apply</button>
    </div>`);
}

function applySpread() {
  if (!_pendingSpread) return;
  const day = dayData(viewDate);
  const ts = new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  _pendingSpread.forEach(s => {
    day.hours[s.id] = s.after;
    day.log.push({id: s.id, delta: s.add, result: s.after, note: 'spread', ts});
  });
  _pendingSpread = null;
  save(state);
  closeModal();
  render();
}
// ── end spread ────────────────────────────────────────────────────────────────

function showModal(html) {
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
}
function closeModal() { document.getElementById('modal-root').innerHTML = ''; }

// ── Wall clock ───────────────────────────────────────────────────────────────
function clockSessions() { return dayData(viewDate).clock.sessions; }
function clockIsRunning() { return clockSessions().some(s => s.end === null); }

function parseHHMM(hhmm) {
  const [h,m] = hhmm.split(':').map(Number);
  const d = new Date(); d.setHours(h,m,0,0); return d;
}

function clockTotalHours() {
  const now = new Date();
  return clockSessions().reduce((sum,s) => {
    const end = s.end ? parseHHMM(s.end) : now;
    return sum + Math.max(0, (end - parseHHMM(s.start)) / 3600000);
  }, 0);
}

function currentHHMM() {
  const n = new Date();
  return `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
}

function isValidHHMM(val) {
  if (!/^\d{1,2}:\d{2}$/.test(val)) return false;
  const [h,m] = val.split(':').map(Number);
  return h>=0 && h<=23 && m>=0 && m<=59;
}

function to12h(hhmm) {
  const [h,m] = hhmm.split(':').map(Number);
  const ampm = h>=12?'PM':'AM', h12 = h%12||12;
  return `${h12}:${String(m).padStart(2,'0')} ${ampm}`;
}

function renderClock() {
  const running = clockIsRunning();
  const totalHrs = clockTotalHours();
  const displayHrs = (Math.floor(totalHrs*10)/10).toFixed(1);
  const active = clockSessions().find(s => s.end===null);
  const statusText = running ? `on clock &mdash; since ${to12h(active.start)}` : 'off clock';
  const bar = document.getElementById('clock-bar');
  if (!bar) return;
  bar.className = `clock-bar ${running?'running':'stopped'}`;
  bar.innerHTML =
    `<span class="clock-indicator${running?' running':''}">&#9679;</span>` +
    `<span class="clock-status-text${running?'':' stopped'}">${statusText}</span>` +
    `<span class="clock-total-display${totalHrs===0?' zero':''}">${displayHrs} hr</span>` +
    `<button class="tool-btn${running?'':' primary'}" onclick="${running?'openClockStop()':'openClockStart()'}">` +
      `${running?'Stop':'Start'}` +
    `</button>` +
    `<button class="tool-btn" onclick="openClockSessions()">Sessions</button>`;
}

function openClockStart() {
  if (clockIsRunning()) return;
  clockSessions().push({start: currentHHMM(), end: null});
  save(state); renderClock();
}

function openClockStop() {
  const running = clockSessions().find(s => s.end===null);
  if (!running) return;
  running.end = currentHHMM();
  save(state); renderClock();
}

function openClockSessions() { renderClockSessionsModal(); }

function renderClockSessionsModal() {
  const sessions = clockSessions();
  const rows = sessions.length
    ? sessions.map((s,i) =>
        `<div class="session-row">
          <input class="time-input" value="${s.start}"
            onchange="updateClockSession(${i},'start',this.value)" placeholder="HH:MM">
          <span style="color:var(--fg-2);font-size:11px">&rarr;</span>
          <input class="time-input${s.end===null?' running-end':''}"
            value="${s.end||''}"
            onchange="updateClockSession(${i},'end',this.value)"
            placeholder="${s.end===null?'running':'HH:MM'}">
          <button class="del-btn" onclick="deleteClockSession(${i})">&#10005;</button>
        </div>`).join('')
    : '<p style="font-size:12px;color:var(--fg-2);padding:6px 0">No sessions yet.</p>';
  const displayHrs = (Math.floor(clockTotalHours()*10)/10).toFixed(1);
  showModal(`<h2>Clock sessions</h2>
    <p style="font-size:10px;color:var(--fg-2);margin-bottom:8px;font-family:var(--font-mono)">24h format &mdash; HH:MM &nbsp;|&nbsp; leave end blank for running session</p>
    <div id="clock-session-list">${rows}</div>
    <button class="tool-btn" style="margin-top:8px" onclick="addClockSession()">+ Add session</button>
    <div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--bd-2);font-size:12px;color:var(--fg-1);font-family:var(--font-mono)">
      Total on clock: <strong style="color:var(--fg-0)">${displayHrs} hr</strong>
    </div>
    <div class="modal-actions">
      <button class="tool-btn primary" onclick="closeModal();renderClock()">Done</button>
    </div>`);
}

function updateClockSession(i, field, val) {
  const sessions = clockSessions();
  const trimmed = val.trim();
  if (field==='end' && trimmed==='') { sessions[i].end = null; }
  else if (isValidHHMM(trimmed))     { sessions[i][field] = trimmed; }
  else return;
  save(state); renderClockSessionsModal();
}

function deleteClockSession(i) {
  clockSessions().splice(i,1);
  save(state); renderClockSessionsModal();
}

function addClockSession() {
  clockSessions().push({start: currentHHMM(), end: null});
  save(state); renderClockSessionsModal();
}

// Refresh every 30 s; auto-advance viewDate at midnight if user was on today
let _tickDate = today();
setInterval(() => {
  const t = today();
  if (t !== _tickDate) { if (viewDate===_tickDate) { viewDate=t; render(); } _tickDate=t; }
  renderClock();
}, 30000);
// ── end wall clock ───────────────────────────────────────────────────────────

render();
renderClock();

document.addEventListener('keydown', e => { if (e.key==='Escape') closeModal(); });
</script>
