<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Tracker</title>
<style>
  /* ============================================================
     SECTION: CSS-DESIGN-TOKENS  (~line 7)
     CSS custom properties: color palette, typography vars, border/fill aliases.
     ============================================================ */
  :root {
    --font-sans: 'Segoe UI', system-ui, -apple-system, sans-serif;
    --font-mono: 'Cascadia Code', 'Cascadia Mono', Consolas, 'Courier New', monospace;

    /* backgrounds */
    --bg:     #0e0e0e;
    --bg-0:   #151515;
    --bg-1:   #1c1c1c;
    --bg-2:   #252525;

    /* foreground */
    --fg-0:   #d0d0d0;
    --fg-1:   #888888;
    --fg-2:   #4a4a4a;

    /* accents */
    --red:    #e05555;
    --green:  #4dab90;
    --blue:   #5aafed;

    /* borders */
    --bd-0:   #5aafed;   /* focus */
    --bd-1:   #2e2e2e;   /* normal */
    --bd-2:   #1d1d1d;   /* subtle */
    --bd-red: #e05555;
    --bd-blue:#1e4a72;

    /* tinted fills */
    --bg-red: rgba(224,85,85,.08);
    --bg-blue:rgba(90,175,237,.08);

    /* ── aliases consumed by inline var() references in the JS ── */
    --color-text-primary:         var(--fg-0);
    --color-text-secondary:       var(--fg-1);
    --color-text-tertiary:        var(--fg-2);
    --color-text-danger:          var(--red);
    --color-text-success:         var(--green);
    --color-text-info:            var(--blue);
    --color-background-primary:   var(--bg-0);
    --color-background-secondary: var(--bg-2);
    --color-background-danger:    var(--bg-red);
    --color-background-info:      var(--bg-blue);
    --color-border-primary:       var(--bd-0);
    --color-border-secondary:     var(--bd-1);
    --color-border-tertiary:      var(--bd-2);
    --color-border-danger:        var(--bd-red);
    --color-border-info:          var(--bd-blue);
    --border-radius-md:           2px;
    --border-radius-lg:           3px;
  }

  /* ============================================================
     SECTION: CSS-BASE  (~line 58)
     Global reset, html/body base styles, #app layout, and scrollbar theming.
     ============================================================ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    background: var(--bg);
    color: var(--fg-0);
    font-family: var(--font-sans);
    font-size: 13px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }

  body { min-height: 100vh; }

  #app {
    max-width: 660px;
    margin: 0 auto;
    padding: 0 18px 48px;
  }

  /* scrollbar */
  ::-webkit-scrollbar             { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track       { background: transparent; }
  ::-webkit-scrollbar-thumb       { background: var(--bd-1); }
  ::-webkit-scrollbar-thumb:hover { background: #444; }

  /* ============================================================
     SECTION: CSS-HEADER  (~line 84)
     Header bar, pay-period bar, title, and date badge styles.
     ============================================================ */
  /* ── header ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0 6px;
    margin-bottom: 0;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }

  .pay-period-bar {
    font-size: 10px;
    font-family: var(--font-mono);
    color: var(--fg-2);
    padding: 3px 0 8px;
    border-bottom: 1px solid var(--bd-2);
    margin-bottom: 10px;
  }

  .title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .10em;
    text-transform: uppercase;
    color: var(--fg-1);
  }

  .date-badge {
    font-size: 11px;
    color: var(--fg-2);
    font-family: var(--font-mono);
  }

  /* ============================================================
     SECTION: CSS-TOOLBAR-AND-CARDS  (~line 120)
     Toolbar, tool-btn, CC list container, data footer, last-saved label, CC card base styles.
     ============================================================ */
  /* ── toolbar ── */
  .toolbar {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--bd-2);
  }

  .tool-btn {
    font-size: 11px;
    font-family: var(--font-sans);
    padding: 4px 10px;
    border: 1px solid var(--bd-1);
    border-radius: 2px;
    background: transparent;
    color: var(--fg-1);
    cursor: pointer;
    transition: background .1s, color .1s;
    white-space: nowrap;
  }

  .tool-btn:hover                { background: var(--bg-2); color: var(--fg-0); }
  .tool-btn.primary              { color: var(--blue); border-color: var(--bd-blue); }
  .tool-btn.primary:hover        { background: var(--bg-blue); }

  /* ── charge code cards ── */
  .cc-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 0;
  }

  /* ── data footer ── */
  .data-footer {
    margin-top: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  #last-saved-label {
    font-size: 10px;
    font-family: var(--font-mono);
    color: var(--fg-2);
    cursor: pointer;
    user-select: none;
  }

  #last-saved-label:hover { color: var(--fg-1); }

  #data-btns {
    display: none;
    gap: 6px;
  }

  .cc-card {
    background: var(--bg-0);
    border: 1px solid var(--bd-2);
    border-radius: 3px;
    padding: 9px 12px;
    transition: border-color .1s;
  }

  .cc-card:hover { border-color: var(--bd-1); }

  .cc-card.empty-state {
    border-style: dashed;
    text-align: center;
    padding: 2.5rem;
    color: var(--fg-2);
    font-size: 12px;
  }

     SECTION: CSS-PROGRAM-CARDS  (~line 197)
     Program group card, pg-header/name/total, pg-row, CC row internals, active tracking, btn-track.
     ============================================================ */
  /* ── program group cards ── */
  .pg-card {
    background: var(--bg-0);
    border: 1px solid var(--bd-2);
    border-radius: 3px;
    transition: border-color .1s;
  }

  .pg-card:hover { border-color: var(--bd-1); }

  .pg-header {

    align-items: baseline;

    padding: 7px 12px 6px;

  .pg-name {
    flex: 1;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--fg-1);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .pg-total {
    font-size: 16px;
    font-weight: 600;
    font-family: var(--font-mono);
    color: var(--fg-0);
    min-width: 44px;
    text-align: right;
    letter-spacing: -.02em;
  }

  .pg-total.zero { color: var(--fg-2); }

  .pg-row { padding: 9px 12px; }
  .pg-row + .pg-row { border-top: 1px dashed var(--bd-2); }

  .cc-top { display: flex; align-items: baseline; gap: 10px; }
  .cc-label { flex: 1; min-width: 0; }

  .cc-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--fg-0);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cc-code {
    font-size: 10px;
    color: var(--fg-2);
    font-family: var(--font-mono);
    letter-spacing: .04em;
    margin-top: 1px;
  }

  .cc-hours {
    font-size: 20px;
    font-weight: 600;
    font-family: var(--font-mono);
    color: var(--fg-0);
    min-width: 44px;
    text-align: right;
    letter-spacing: -.02em;
  }

  .cc-hours.zero { color: var(--fg-2); }
  .cc-hours.accumulating { animation: hours-pulse 2s ease-in-out infinite; }

  @keyframes hours-pulse {
    0%, 100% { color: var(--fg-0); }
    50%       { color: var(--green); }
  }

  /* ── live tracker ── */
  .cc-card.active-tracking { background: rgba(77,171,144,.05); border-color: rgba(77,171,144,.35); }
  .pg-row.active-tracking  { background: rgba(77,171,144,.05); }

    font-size: 11px; font-family: var(--font-mono);
    padding: 3px 8px; border: 1px solid var(--bd-2); border-radius: 2px;

  .btn-track.on:hover   { background: rgba(77,171,144,.18); }

    position: fixed;

    align-items: center;

    background: var(--bg-1);

    overflow-y: auto;
  }

  .modal h2 {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;

    border-bottom: 1px solid var(--bd-2);

  .field label {
    font-size: 10px;

  .eod-note:focus { outline: none; border-color: var(--bd-0); }

  .clock-bar.eod-done {

  .del-btn {

    color: var(--blue);
    background: var(--bg-blue);

<div id="app">
  <div class="header">
    <div class="title">Time tracker</div>
    <div style="display:flex;align-items:center;gap:4px">
      <button class="nav-btn" onclick="navigate(-1)" title="Previous day">&#8249;</button>
      <span class="date-badge" id="date-badge"></span>
      <button class="nav-btn" id="nav-fwd" onclick="navigate(1)" title="Next day">&#8250;</button>
    </div>
  </div>

  <div class="pay-period-bar" id="pay-period-bar"></div>

  <div class="toolbar">
    <button class="tool-btn primary" onclick="openAddCC()">+ Add charge code</button>
    <button class="tool-btn" onclick="openManage()">Manage CCs</button>
    <button class="tool-btn" onclick="openSpread()">Spread hours</button>
    <button class="tool-btn" onclick="openEndOfDay()">End of day</button>
    <button class="tool-btn" onclick="confirmReset()">Reset day</button>
  </div>

  <div id="past-day-banner" style="display:none" class="past-day-banner">
    Viewing a past day &mdash; edits apply to that day.
    <button class="tool-btn" style="margin-left:auto" onclick="goToToday()">Go to today</button>
  </div>
  <div id="clock-bar" class="clock-bar"></div>

  <div class="cc-list" id="cc-list"></div>

  <div class="data-footer">
    <span id="last-saved-label" onclick="revealDataButtons()">not saved yet</span>
    <div id="data-btns">
      <button class="tool-btn" id="incr-toggle-btn" onclick="toggleIncrements()">Click to Increment</button>
      <button class="tool-btn" onclick="importJSON()">Import JSON</button>
      <button class="tool-btn" onclick="exportJSON()">Export JSON</button>
    </div>
  </div>
</div>
<input type="file" id="json-file-input" accept=".json,application/json" style="display:none" onchange="handleJSONFile(event)">

<div id="modal-root"></div>

<script>
// ================================================================
// SECTION: JS-PERSISTENCE  (~line 598)
// localStorage load/save, v2→v3 migration, dayData accessor, JSON export/import.
// ================================================================
const STORAGE_KEY = 'cc_tracker_v3';
let lastSavedAt = null;
let _dataBtnTimer = null;

// ── Persistence ─────────────────────────────────────────────────────────────
// v3 schema: { codes:[{id,code,name}], days:{"YYYY-MM-DD":{hours:{id:n},clock:{sessions:[]}}} }
// Migrates from v2 (cc_tracker_v2) and clock v1 (cc_tracker_clock_v1) on first load.

function ymdLocal(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function today() { return ymdLocal(new Date()); }

function migrateFromV2() {
  try {
    const raw = localStorage.getItem('cc_tracker_v2');
    if (!raw) return null;
    const v2 = JSON.parse(raw);
    const v3 = {codes: [], days: {}};
    v3.codes = (v2.codes || []).map(({id, code, name}) => ({id, code, name}));
    if (v2.date) {
      const hours = {};
      (v2.codes || []).forEach(c => { hours[c.id] = c.hours || 0; });

// Pay period bar calculation and the main render() function that rebuilds the CC list.
// ================================================================
// ── Pay period ───────────────────────────────────────────────────────────────
const PP_ANCHOR = new Date('2026-04-04T12:00:00'); // known period-end Saturday

function payPeriodEnd(fromDateStr) {
  const d = new Date(fromDateStr + 'T12:00:00');
  const diffDays = Math.round((d - PP_ANCHOR) / 86400000);
  const daysIntoPeriod = ((diffDays % 14) + 14) % 14;
  const daysUntilEnd = daysIntoPeriod === 0 ? 0 : 14 - daysIntoPeriod;
  const end = new Date(d);
  end.setDate(end.getDate() + daysUntilEnd);
  return end;
}

function workingDaysRemaining(fromDateStr, endDate) {
  const from = new Date(fromDateStr + 'T12:00:00');
  let count = 0;
  const d = new Date(from);
  while (d <= endDate) {
    const dow = d.getDay();
    if (dow >= 1 && dow <= 5) count++;
    d.setDate(d.getDate() + 1);
  }
  return count;
}

function payPeriodHours(endDate) {
  const start = new Date(endDate);
  start.setDate(start.getDate() - 13);
  let total = 0;
  for (const [dateStr, day] of Object.entries(state.days || {})) {
    const d = new Date(dateStr + 'T12:00:00');
    if (d >= start && d <= endDate) {
      total += Object.values(day.hours || {}).reduce((s, h) => s + h, 0);
    }
  }
  return parseFloat(total.toFixed(1));
}

function renderPayPeriod() {
  const el = document.getElementById('pay-period-bar');
  if (!el) return;
  const end = payPeriodEnd(today());
  const dayAbbr = end.toLocaleDateString([], {weekday:'short'});
  const dateStr = `${end.getMonth()+1}/${end.getDate()}`;
  const wdLeft = workingDaysRemaining(today(), end);
  const hrs = payPeriodHours(end);
  const hrsStr = `<span${hrs >= 80 ? ' style="color:var(--green)"' : ''}>${hrs.toFixed(1)}</span>`;
  el.innerHTML = `Pay period ends ${dayAbbr} ${dateStr}  (${wdLeft} working day${wdLeft===1?'':'s'})  —  Pay period hours: ${hrsStr}`;
}

function render() {
  renderPayPeriod();
  const isToday = viewDate === today();
  const viewDt = new Date(viewDate + 'T12:00:00');
  document.getElementById('date-badge').textContent =
    viewDt.toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'}) +
    (isToday ? ' — today' : '');

  const navFwd = document.getElementById('nav-fwd');
  if (navFwd) navFwd.disabled = isToday;

  const banner = document.getElementById('past-day-banner');
  if (banner) banner.style.display = isToday ? 'none' : 'flex';

  const day = dayData(viewDate);

  const list = document.getElementById('cc-list');
  const activeCodes = state.codes.filter(cc => !cc.archived);
  if (!activeCodes.length) {
    list.innerHTML = '<div class="cc-card empty-state">No charge codes yet — add one above</div>';
    return;
  }

  const grouped = {};
  const ungrouped = [];
  activeCodes.forEach(cc => {
    const prog = (cc.program || '').trim();
    if (prog) {
      if (!grouped[prog]) grouped[prog] = [];
      grouped[prog].push(cc);
    } else {
      ungrouped.push(cc);
    }
  });
  const programNames = Object.keys(grouped)
    .sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));

  list.innerHTML = [
    ...programNames.map(n => renderProgramCard(n, grouped[n], day)),
    ...ungrouped.map(cc => renderIndividualCard(cc, day))
  ].join('');
}

    lines.push(`${cc.code}  ${cc.nickname || cc.name}`);
    lines.push(`  ${hrs.toFixed(1)} hr`);
    if (note) lines.push(`  ${note}`);
    lines.push('');
  });
  lines.push(`Total: ${total.toFixed(1)} hr`);
  const text = lines.join('\n');
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('#modal-root .primary');
    if (btn) { btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = 'Copy to clipboard', 1500); }
  });
}

// SECTION: JS-SPREAD-HOURS  (~line 1201)
// Spread-hours modal: proportionally distributes unallocated clock time across selected CCs.
// ================================================================
// ── Spread hours ─────────────────────────────────────────────────────────────
// Distributes unallocated clock time proportionally across CCs that already
// have logged hours.  Uses integer tenths throughout to avoid float drift.

function computeSpread(activeCCs, dayHours, unallocTenths) {
  const selectedTenths = activeCCs.reduce((s,c) => s + Math.round((dayHours[c.id]||0)*10), 0);
  if (unallocTenths <= 0 || selectedTenths === 0) return null;

  // Exact proportional share for each CC (in tenths), relative to selected CCs only
  const exact = activeCCs.map(c => (Math.round((dayHours[c.id]||0)*10) / selectedTenths) * unallocTenths);

  // Floor each, then give leftover tenths to largest fractional parts
  const floors = exact.map(v => Math.floor(v));
  let remainder = unallocTenths - floors.reduce((s,v) => s+v, 0);
  exact.map((v,i) => ({i, frac: v - Math.floor(v)}))
       .sort((a,b) => b.frac - a.frac)
       .forEach(({i}) => { if (remainder-- > 0) floors[i]++; });

  return activeCCs.map((c,i) => {
    const beforeT = Math.round((dayHours[c.id]||0)*10);
    return { id: c.id, name: c.name, before: beforeT/10, add: floors[i]/10, after: (beforeT+floors[i])/10 };
  });
}

let _pendingSpread = null;
let _spreadState = null; // {candidateCCs, day, unallocTenths}

function openSpread() {
  const day = dayData(viewDate);
  const clockHrs = parseFloat((Math.floor(clockTotalHours()*10)/10).toFixed(1));
  const loggedHrs = parseFloat(state.codes.filter(c => !c.archived).reduce((s,c) => s+(day.hours[c.id]||0), 0).toFixed(1));
  const unallocHrs = parseFloat((clockHrs - loggedHrs).toFixed(1));
  const candidateCCs = state.codes.filter(c => !c.archived && (day.hours[c.id]||0) > 0);

  const bail = (msg) => showModal(`<h2>Spread hours</h2>
    <p style="font-size:13px;color:var(--fg-1);margin-bottom:14px">${msg}</p>
    <div class="modal-actions"><button class="tool-btn primary" onclick="closeModal()">OK</button></div>`);

  if (clockHrs === 0)            return bail('No clock time recorded for this day.');
  if (candidateCCs.length === 0) return bail('No charge code hours to spread from — log some time first.');
  if (unallocHrs <= 0)           return bail(`No unallocated time: logged <strong>${loggedHrs.toFixed(1)} hr</strong> already meets or exceeds clock time <strong>${clockHrs.toFixed(1)} hr</strong>.`);

  _spreadState = {candidateCCs, day, unallocTenths: Math.round(unallocHrs * 10)};

  const rows = candidateCCs.map(cc => {
    const prog = (cc.program || '').trim();
    const label = prog ? `${prog}: ${cc.nickname || cc.name}` : (cc.nickname || cc.name);
    const checked = !cc.spreadExcluded;
    return `<div style="display:flex;align-items:baseline;gap:10px;padding:5px 0;border-bottom:1px solid var(--bd-2)">
      <input type="checkbox" id="sc-${cc.id}" ${checked?'checked':''} onchange="refreshSpreadPreview()" style="cursor:pointer;accent-color:var(--blue);flex-shrink:0;margin:0">
      <span style="flex:1;font-size:12px;color:var(--fg-0)">${esc(label)}</span>
      <span style="font-family:var(--font-mono);font-size:12px;color:var(--fg-2);min-width:32px;text-align:right">${(day.hours[cc.id]||0).toFixed(1)}</span>
      <span style="font-family:var(--font-mono);font-size:12px;color:var(--blue);min-width:36px;text-align:right" id="sp-add-${cc.id}"></span>
      <span style="font-family:var(--font-mono);font-size:13px;font-weight:600;min-width:36px;text-align:right" id="sp-after-${cc.id}"></span>
    </div>`;
  }).join('');

  showModal(`<h2>Spread hours</h2>
    <div style="display:flex;gap:16px;font-size:12px;color:var(--fg-1);font-family:var(--font-mono);margin-bottom:12px">
      <span>Clock&nbsp;<strong style="color:var(--fg-0)">${clockHrs.toFixed(1)} hr</strong></span>
      <span>Logged&nbsp;<strong style="color:var(--fg-0)">${loggedHrs.toFixed(1)} hr</strong></span>
      <span>Unallocated&nbsp;<strong style="color:var(--blue)">${unallocHrs.toFixed(1)} hr</strong></span>
    </div>
    <div style="display:flex;gap:10px;padding:2px 0 5px;font-size:10px;color:var(--fg-2);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--bd-1)">
      <span style="width:13px;flex-shrink:0"></span>
      <span style="flex:1">Charge code</span>
      <span style="min-width:32px;text-align:right">Before</span>
      <span style="min-width:36px;text-align:right">Add</span>
      <span style="min-width:36px;text-align:right">After</span>
    </div>
    ${rows}
    <div style="display:flex;gap:10px;padding:6px 0 0;font-size:12px;font-family:var(--font-mono)">
      <span style="width:13px;flex-shrink:0"></span>
      <span style="flex:1;color:var(--fg-2)">New total</span>
      <span style="min-width:32px"></span><span style="min-width:36px"></span>
      <span style="font-weight:600;color:var(--fg-0);min-width:36px;text-align:right" id="sp-new-total"></span>
    </div>
    <div class="modal-actions">
      <button class="tool-btn" onclick="closeModal()">Cancel</button>
      <button class="tool-btn primary" id="sp-apply-btn" onclick="applySpread()">Apply</button>
    </div>`);

  refreshSpreadPreview();
}

function refreshSpreadPreview() {
  if (!_spreadState) return;
  const {candidateCCs, day, unallocTenths} = _spreadState;

  const selected = candidateCCs.filter(cc => {
    const el = document.getElementById('sc-' + cc.id);
    return el && el.checked;
  });

  candidateCCs.forEach(cc => {
    const el = document.getElementById('sc-' + cc.id);
    if (el) cc.spreadExcluded = !el.checked;
  });
  save(state);

  _pendingSpread = selected.length > 0 ? computeSpread(selected, day.hours, unallocTenths) : null;

  candidateCCs.forEach(cc => {
    const addEl   = document.getElementById('sp-add-'   + cc.id);
    const afterEl = document.getElementById('sp-after-' + cc.id);
    if (addEl)   addEl.textContent = '';
    if (afterEl) { afterEl.textContent = (day.hours[cc.id]||0).toFixed(1); afterEl.style.color = 'var(--fg-2)'; }
  });

  if (_pendingSpread) {
    _pendingSpread.forEach(s => {
      const addEl   = document.getElementById('sp-add-'   + s.id);
      const afterEl = document.getElementById('sp-after-' + s.id);
      if (addEl)   addEl.textContent = '+' + s.add.toFixed(1);
      if (afterEl) { afterEl.textContent = s.after.toFixed(1); afterEl.style.color = 'var(--green)'; }
    });
  }

  const totalEl  = document.getElementById('sp-new-total');
  const applyBtn = document.getElementById('sp-apply-btn');
  if (_pendingSpread) {
    const spreadById = Object.fromEntries(_pendingSpread.map(s => [s.id, s.after]));
    const newTotal = state.codes.reduce((s,c) => s + (spreadById[c.id] ?? (day.hours[c.id]||0)), 0);
    if (totalEl)  totalEl.textContent = newTotal.toFixed(1);
    if (applyBtn) applyBtn.disabled = false;
  } else {
    if (totalEl)  totalEl.textContent = '—';
    if (applyBtn) applyBtn.disabled = true;
  }
}

function applySpread() {
  if (!_pendingSpread) return;
  const day = dayData(viewDate);
  _pendingSpread.forEach(s => { day.hours[s.id] = s.after; });
  _pendingSpread = null;
  save(state);
  closeModal();
  render();
}

// SECTION: JS-WALL-CLOCK  (~line 1349)
// Wall-clock bar: session storage helpers, renderClock, Start/Stop, and sessions modal.
// ================================================================
// ── Wall clock ───────────────────────────────────────────────────────────────
function clockSessions() { return dayData(viewDate).clock.sessions; }
function clockIsRunning() { return clockSessions().some(s => s.end === null); }

function parseHHMM(hhmm) {
  const [h,m] = hhmm.split(':').map(Number);
  const d = new Date(); d.setHours(h,m,0,0); return d;
}

function clockTotalHours() {
  const now = new Date();
  return clockSessions().reduce((sum,s) => {
    const end = s.end ? parseHHMM(s.end) : now;
    return sum + Math.max(0, (end - parseHHMM(s.start)) / 3600000);
  }, 0);
}

function currentHHMM() {
  const n = new Date();
  return `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
}

function isValidHHMM(val) {
  if (!/^\d{1,2}:\d{2}$/.test(val)) return false;
  const [h,m] = val.split(':').map(Number);
  return h>=0 && h<=23 && m>=0 && m<=59;
}

function to12h(hhmm) {
  const [h,m] = hhmm.split(':').map(Number);
  const ampm = h>=12?'PM':'AM', h12 = h%12||12;
  return `${h12}:${String(m).padStart(2,'0')} ${ampm}`;
}

function renderClock() {
  const running = clockIsRunning();
  const totalHrs = clockTotalHours();
  const displayHrs = (Math.floor(totalHrs*10)/10).toFixed(1);
  const active = clockSessions().find(s => s.end===null);
  const activeCC = state.activeTimer ? state.codes.find(c => c.id === state.activeTimer.ccId) : null;
  const activeCCLabel = activeCC ? ((activeCC.program||'').trim() ? `${esc(activeCC.program)} \u2014 ${esc(activeCC.name)}` : esc(activeCC.name)) : '';
  const activeCCText = activeCC ? `&nbsp;&nbsp;<span style="color:var(--green)">&#9654;&nbsp;${activeCCLabel}</span>` : '';
  const statusText = (running ? `on clock &mdash; since ${to12h(active.start)}` : 'off clock') + activeCCText;
  const bar = document.getElementById('clock-bar');
  if (!bar) return;
  const eodDone = Object.values(dayData(viewDate).notes || {}).some(n => n);
  bar.className = `clock-bar ${running?'running':'stopped'}${eodDone?' eod-done':''}`;
  bar.innerHTML =
    `<span class="clock-indicator${running?' running':''}">&#9679;</span>` +
    `<span class="clock-status-text${running?'':' stopped'}">${statusText}</span>` +
    `<span class="clock-total-display${totalHrs===0?' zero':''}">${displayHrs} hr</span>` +
    `<button class="tool-btn${running?'':' primary'}" onclick="${running?'openClockStop()':'openClockStart()'}">` +
      `${running?'Stop':'Start'}` +
    `</button>` +
    `<button class="tool-btn" onclick="openClockSessions()">Sessions</button>`;
}

function openClockStart() {
  if (clockIsRunning()) return;
  clockSessions().push({start: currentHHMM(), end: null});
  if (state.activeTimer && !state.activeTimer.sessionStart) {
    state.activeTimer.sessionStart = Date.now();
    state.activeTimer.committedTenths = 0;
  }
  save(state); renderClock(); render();
}

function openClockStop() {
  const running = clockSessions().find(s => s.end===null);
  if (!running) return;
  finalizeActiveTimer();
  state.activeTimer = null;
  running.end = currentHHMM();
  save(state); renderClock(); render();
}

function openClockSessions() { renderClockSessionsModal(); }

function renderClockSessionsModal() {
  const sessions = clockSessions();
  const rows = sessions.length
    ? sessions.map((s,i) =>
        `<div class="session-row">
          <input class="time-input" value="${s.start}"
            onchange="updateClockSession(${i},'start',this.value)" placeholder="HH:MM">
          <span style="color:var(--fg-2);font-size:11px">&rarr;</span>
          <input class="time-input${s.end===null?' running-end':''}"
            value="${s.end||''}"
            onchange="updateClockSession(${i},'end',this.value)"
            placeholder="${s.end===null?'running':'HH:MM'}">
          <button class="del-btn" onclick="deleteClockSession(${i})">&#10005;</button>
        </div>`).join('')
    : '<p style="font-size:12px;color:var(--fg-2);padding:6px 0">No sessions yet.</p>';
  const displayHrs = (Math.floor(clockTotalHours()*10)/10).toFixed(1);
  showModal(`<h2>Clock sessions</h2>
    <p style="font-size:10px;color:var(--fg-2);margin-bottom:8px;font-family:var(--font-mono)">24h format &mdash; HH:MM &nbsp;|&nbsp; leave end blank for running session</p>
    <div id="clock-session-list">${rows}</div>
    <button class="tool-btn" style="margin-top:8px" onclick="addClockSession()">+ Add session</button>
    <div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--bd-2);font-size:12px;color:var(--fg-1);font-family:var(--font-mono)">
      Total on clock: <strong style="color:var(--fg-0)">${displayHrs} hr</strong>
    </div>
    <div class="modal-actions">
      <button class="tool-btn primary" onclick="closeModal();renderClock()">Done</button>
    </div>`);
}

function updateClockSession(i, field, val) {
  const sessions = clockSessions();
  const trimmed = val.trim();
  if (field==='end' && trimmed==='') { sessions[i].end = null; }
  else if (isValidHHMM(trimmed))     { sessions[i][field] = trimmed; }
  else return;
  save(state); renderClockSessionsModal();
}

function deleteClockSession(i) {
  clockSessions().splice(i,1);
  save(state); renderClockSessionsModal();
}

function addClockSession() {
  clockSessions().push({start: currentHHMM(), end: null});
  save(state); renderClockSessionsModal();
}

// SECTION: JS-TICK-INTERVALS  (~line 1474)
// 30-second tick for midnight auto-advance; 1-second tick for live CC auto-commit.
// ================================================================
// Refresh every 30 s; auto-advance viewDate at midnight
let _tickDate = today();
setInterval(() => {
  const t = today();
  if (t !== _tickDate) {
    if (state.activeTimer) { finalizeActiveTimer(); state.activeTimer = null; save(state); }
    if (viewDate===_tickDate) { viewDate=t; render(); }
    _tickDate=t;
  }
  renderClock();
}, 30000);

// 1-second tick: auto-commit elapsed tenths and update displays
setInterval(() => {
  if (!state.activeTimer || !state.activeTimer.sessionStart || !clockIsRunning()) return;
  const {ccId, sessionStart, committedTenths = 0} = state.activeTimer;
  const elapsedTenths = Math.floor((Date.now() - sessionStart) / 360000);
  if (elapsedTenths > committedTenths) {
    const delta = (elapsedTenths - committedTenths) / 10;
    state.activeTimer.committedTenths = elapsedTenths;
    const day = dayData(today());
    day.hours[ccId] = parseFloat(((day.hours[ccId] || 0) + delta).toFixed(1));
    save(state);
    const hoursEl = document.getElementById('cc-hours-' + ccId);
    if (hoursEl) {
      hoursEl.textContent = day.hours[ccId].toFixed(1);
      hoursEl.className = `cc-hours accumulating`;
      const pgCard = hoursEl.closest('.pg-card');
      if (pgCard) {
        const pgTotalEl = pgCard.querySelector('.pg-total');
        if (pgTotalEl) {
          const cc = state.codes.find(c => c.id === ccId);
          if (cc) {
            const programName = (cc.program || '').trim();
            const programCodes = state.codes.filter(c => (c.program || '').trim() === programName);
            const pgTotal = programCodes.reduce((s, c) => s + (day.hours[c.id] || 0), 0);
            pgTotalEl.textContent = pgTotal.toFixed(1);
            pgTotalEl.className = `pg-total${pgTotal === 0 ? ' zero' : ''}`;
          }
        }
      }
    }
    renderPayPeriod();
    renderClock();
  }
}, 1000);
